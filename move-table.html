<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ย้ายโต๊ะ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090b;--surface:#18181b;--surface2:#27272a;--surface3:#3f3f46;
  --border:#27272a;--border2:#3f3f46;
  --text:#fafafa;--muted:#a1a1aa;--muted2:#71717a;
  --green:#4ade80;--green-dim:rgba(74,222,128,0.1);--green-border:rgba(74,222,128,0.2);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,0.1);--amber-border:rgba(251,191,36,0.2);
  --blue:#60a5fa;--blue-dim:rgba(96,165,250,0.1);--blue-border:rgba(96,165,250,0.2);
  --red:#f87171;--red-dim:rgba(248,113,113,0.1);--red-border:rgba(248,113,113,0.2);
  --r:10px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Sarabun',sans-serif;font-size:15px;display:flex;flex-direction:column}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{font-family:'Kanit',sans-serif;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.hint{padding:12px 16px;font-size:13px;color:var(--muted);flex-shrink:0;line-height:1.5}
.hint b{color:var(--text)}

.list-scroll{flex:1;overflow-y:auto;padding:0 16px 140px}
.list-scroll::-webkit-scrollbar{display:none}

.section-label{font-size:12px;color:var(--muted2);font-weight:600;letter-spacing:.03em;margin:14px 0 8px}

.table-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .12s,background .12s}
.table-card:active{background:var(--surface2)}
.table-card.selected{border-color:var(--blue);background:var(--blue-dim)}
.tc-row{display:flex;justify-content:space-between;align-items:center}
.tc-name{font-family:'Kanit',sans-serif;font-size:17px;font-weight:600}
.tc-meta{font-size:12px;color:var(--muted);margin-top:3px}
.tc-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.table-card.selected .tc-check{background:var(--blue);border-color:var(--blue)}
.table-card.selected .tc-check::after{content:'✓';color:#000;font-size:13px;font-weight:700}

.no-tables{text-align:center;padding:50px 20px;color:var(--muted2);font-size:14px}

.action-bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.3)}
.ab-from{font-size:13px;color:var(--muted);margin-bottom:8px;min-height:18px}
.ab-from b{color:var(--blue)}
.ab-row{display:flex;gap:8px}
.ab-input{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'Kanit',sans-serif;font-size:15px;text-transform:uppercase}
.ab-input::placeholder{color:var(--muted2);text-transform:none}
.ab-input:focus{outline:none;border-color:var(--blue)}
.ab-btn{background:var(--blue);color:#000;border:none;border-radius:10px;padding:0 20px;font-family:'Kanit',sans-serif;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.ab-btn:disabled{opacity:.35;cursor:not-allowed}

.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--green-dim);border:1px solid var(--green-border);color:var(--green);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="live-dot"></span>🔀 ย้ายโต๊ะ</div>
</div>

<div class="hint">แตะโต๊ะที่ต้องการย้าย (<b>โต๊ะต้นทาง</b>) แล้วพิมพ์โต๊ะปลายทางด้านล่าง ออเดอร์ที่ค้างอยู่ทั้งหมดของโต๊ะต้นทางจะย้ายไปโต๊ะใหม่ทันที</div>

<div class="list-scroll" id="list-scroll">
  <div class="no-tables">ยังไม่มีโต๊ะที่เปิดอยู่</div>
</div>

<div class="toast" id="toast"></div>

<div class="action-bar">
  <div class="ab-from" id="ab-from">ยังไม่ได้เลือกโต๊ะต้นทาง</div>
  <div class="ab-row">
    <input class="ab-input" id="target-input" placeholder="โต๊ะปลายทาง เช่น F5" oninput="this.value=this.value.toUpperCase();updateButton()">
    <button class="ab-btn" id="move-btn" disabled onclick="doMove()">ย้ายโต๊ะ</button>
  </div>
</div>

<script>
let ws;
let tickets = [];
let selectedTable = null;

function connect(){
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}`);

  ws.onopen = () => {};

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'init') { tickets = msg.tickets || []; renderList(); }
    if (msg.type === 'ticket_added') { tickets.push(msg.ticket); renderList(); }
    if (msg.type === 'ticket_updated') {
      const i = tickets.findIndex(t => t.num === msg.ticket.num);
      if (i >= 0) tickets[i] = msg.ticket; else tickets.push(msg.ticket);
      renderList();
    }
    if (msg.type === 'ticket_deleted') { tickets = tickets.filter(t => t.num !== msg.num); renderList(); }
    if (msg.type === 'all_tickets_deleted') { tickets = []; renderList(); }
    if (msg.type === 'table_cleared') { tickets.forEach(t => { if (t.table === msg.table) t.tableCleared = true; }); renderList(); }
    if (msg.type === 'table_moved') {
      renderList();
      if (msg.fromTable === selectedTable) resetSelection();
      showToast(`ย้ายโต๊ะ ${msg.fromTable} → ${msg.toTable} เรียบร้อย (${msg.count} ออเดอร์)`);
    }
  };

  ws.onclose = () => { setTimeout(connect, 1500); };
}
connect();

function getOpenTables(){
  const byTable = {};
  tickets.filter(t => !t.tableCleared).forEach(t => {
    if (!byTable[t.table]) byTable[t.table] = { orders: 0, items: 0 };
    byTable[t.table].orders += 1;
    byTable[t.table].items += t.items.reduce((s, i) => s + i.qty, 0);
  });
  return Object.keys(byTable).sort(sortTableIds).map(n => ({ table: n, ...byTable[n] }));
}

function sortTableIds(a, b){
  const pa = String(a).match(/^([A-Za-z]*)(\d*)$/) || [, '', ''];
  const pb = String(b).match(/^([A-Za-z]*)(\d*)$/) || [, '', ''];
  if (pa[1] !== pb[1]) return pa[1].localeCompare(pb[1]);
  return (parseInt(pa[2]) || 0) - (parseInt(pb[2]) || 0);
}

function renderList(){
  const el = document.getElementById('list-scroll');
  const open = getOpenTables();
  if (!open.length) {
    el.innerHTML = '<div class="no-tables">ยังไม่มีโต๊ะที่เปิดอยู่</div>';
    if (selectedTable !== null) resetSelection();
    return;
  }
  el.innerHTML = `<div class="section-label">โต๊ะที่เปิดอยู่ (${open.length})</div>` + open.map(t => `
    <div class="table-card ${t.table === selectedTable ? 'selected' : ''}" onclick="selectTable('${t.table}')">
      <div class="tc-row">
        <div>
          <div class="tc-name">โต๊ะ ${t.table}</div>
          <div class="tc-meta">${t.orders} ออเดอร์ · ${t.items} รายการ</div>
        </div>
        <div class="tc-check"></div>
      </div>
    </div>
  `).join('');
}

function selectTable(n){
  selectedTable = (selectedTable === n) ? null : n;
  renderList();
  document.getElementById('ab-from').innerHTML = selectedTable
    ? `กำลังย้ายโต๊ะ <b>${selectedTable}</b> ไปยัง...`
    : 'ยังไม่ได้เลือกโต๊ะต้นทาง';
  updateButton();
}

function resetSelection(){
  selectedTable = null;
  document.getElementById('target-input').value = '';
  document.getElementById('ab-from').textContent = 'ยังไม่ได้เลือกโต๊ะต้นทาง';
  updateButton();
}

function updateButton(){
  const target = document.getElementById('target-input').value.trim();
  document.getElementById('move-btn').disabled = !(selectedTable && target && target !== selectedTable);
}

function doMove(){
  const target = document.getElementById('target-input').value.trim().toUpperCase();
  if (!selectedTable || !target || target === selectedTable) return;

  const destHasOrders = tickets.some(t => t.table === target && !t.tableCleared);
  const warnMsg = destHasOrders
    ? `โต๊ะ ${target} มีออเดอร์ค้างอยู่แล้ว\nต้องการรวมออเดอร์จากโต๊ะ ${selectedTable} เข้ากับโต๊ะ ${target} หรือไม่?`
    : `ย้ายออเดอร์ที่ค้างอยู่ทั้งหมดจากโต๊ะ ${selectedTable} ไปโต๊ะ ${target}?`;
  if (!confirm(warnMsg)) return;

  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'move_table', fromTable: selectedTable, toTable: target }));
  }
}

function showToast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
